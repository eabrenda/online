<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#a9005c">
<title>Tudo pronto?</title>

<style>
* {
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  margin: 0;
  padding: 22px;
  display: grid;
  place-items: center;
  font-family: Arial, Helvetica, sans-serif;
  color: #28131f;
  background:
    radial-gradient(ellipse at 18% 8%, rgba(255,65,157,.46), transparent 34%),
    radial-gradient(ellipse at 88% 88%, rgba(174,0,91,.38), transparent 36%),
    linear-gradient(155deg, #a9005c 0%, #690039 48%, #31001e 100%);
}

.wrap {
  width: min(100%, 430px);
}

.card {
  padding: 35px 23px 25px;
  border: 1px solid rgba(255,255,255,.55);
  border-radius: 23px;
  background: linear-gradient(145deg, #ffe0e8 0%, #ffcbd9 100%);
  box-shadow: 0 20px 55px rgba(20,0,13,.27);
  text-align: center;
}

h2.club-title {
  margin: 0 0 5px;
  color: #9d0759;
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -.3px;
}

h1 {
  margin: 0;
  color: #9d0759;
  font-size: 28px;
  line-height: 1.2;
  letter-spacing: -.5px;
  font-weight: 800;
}

.description {
  margin: 10px 0 25px;
  color: #8c5b73;
  font-size: 16px;
  font-weight: 500;
  line-height: 1.4;
}

.instructions-box {
  background: #ffffff;
  border: 1.5px solid #e3aabf;
  border-radius: 16px;
  padding: 20px 18px;
  text-align: left;
}

.alert-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 800;
  font-size: 16px;
  color: #1a1a1a;
  margin-bottom: 18px;
}

.alert-icon {
  color: #9d0759;
  display: flex;
  align-items: center;
  justify-content: center;
}

.step {
  font-size: 16px;
  color: #2b2b2b;
  margin: 14px 0;
  line-height: 1.4;
}

.step strong {
  font-weight: 800;
  color: #1a1a1a;
}

.final-step-title {
  margin: 24px 0 12px;
  color: #9d0759;
  font-size: 15px;
  font-weight: 800;
  text-align: left;
}

.confirm {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 15px 14px;
  border: 1px solid rgba(153,0,76,.23);
  border-radius: 14px;
  background: rgba(255,255,255,.63);
  text-align: left;
  cursor: pointer;
  transition: border-color .2s, box-shadow .2s, transform .1s;
}

.confirm:active {
  transform: scale(0.98);
}

.confirm:has(input:checked) {
  border-color: #bd176b;
  box-shadow: 0 0 0 3px rgba(189,23,107,.10);
}

.confirm input {
  appearance: none;
  flex: 0 0 24px;
  width: 24px;
  height: 24px;
  margin: 0;
  border: 2px solid #b58b9d;
  border-radius: 6px;
  background: white;
  position: relative;
  cursor: pointer;
}

.confirm input:checked {
  border-color: #a9005c;
  background: linear-gradient(135deg, #ed4b99, #a9005c);
}

.confirm input:checked::after {
  content: "✓";
  position: absolute;
  inset: -1px 0 0;
  color: white;
  font-size: 18px;
  font-weight: 800;
  text-align: center;
}

.confirm strong {
  display: block;
  margin-bottom: 3px;
  color: #351525;
  font-size: 14px;
  line-height: 1.4;
}

.confirm small {
  display: block;
  color: #8a6d7b;
  font-size: 11px;
  line-height: 1.45;
}

.status {
  margin: 18px 0 0;
  color: #9d0759;
  font-size: 13px;
  font-weight: 800;
  line-height: 1.5;
}

@media (max-width: 380px) {
  body {
    padding: 17px;
  }
  .card {
    padding: 30px 18px 20px;
  }
  .step {
    font-size: 15px;
  }
}
</style>
</head>

<body>

<main class="wrap">

  <section class="card">

    <h2 class="club-title">Brendinha 🦋</h2>
    <h1>Tudo pronto?</h1>

    <p class="description">
      Só falta um passo para continuar.
    </p>

    <div class="instructions-box">
      
      <div class="alert-title">
        <div class="alert-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
        </div>
        ATENÇÃO! COMO ACESSAR
      </div>

      <div class="step">
        <strong>1.</strong> Toque nos três pontinhos (···) acima.
      </div>
      
      <div class="step">
        <strong>2.</strong> Selecione "Abrir no navegador".
      </div>
      
      <div class="step">
        <strong>3.</strong> Acesse pelo navegador externo.
      </div>

    </div>

    <p class="final-step-title">
      ✨ Último passo: (Após abrir no navegador)
    </p>

    <label class="confirm" for="confirmar">
      <input id="confirmar" type="checkbox">
      <span>
        <strong>Confirmar e continuar</strong>
        <small>Toque no quadradinho para prosseguir</small>
      </span>
    </label>

    <p class="status" id="status" role="status" aria-live="polite" hidden>
      ✨ Confirmação concluída. Abrindo a próxima página...
    </p>

  </section>

</main>

<script>
  const checkbox = document.getElementById('confirmar');
  const status = document.getElementById('status');
  const destination = 'https://www.crownbot.com.br/brenda';

  checkbox.addEventListener('change', () => {
    if (checkbox.checked) {
      // Bloqueia a caixinha para o usuário não desmarcar enquanto carrega
      checkbox.disabled = true; 
      
      // Mostra a mensagem de carregamento
      status.hidden = false;

      // Redireciona após 800 milissegundos (0.8 segundos)
      window.setTimeout(() => {
        window.location.href = destination;
      }, 800);
    }
  });
</script>

</body>
</html>
